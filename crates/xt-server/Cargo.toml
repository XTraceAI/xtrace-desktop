[package]
name = "xt-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
serde.workspace = true
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
xt-store = { path = "../xt-store" }
xt-ingest = { path = "../xt-ingest" }
uuid = { version = "=1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["io-util", "time"] }
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
