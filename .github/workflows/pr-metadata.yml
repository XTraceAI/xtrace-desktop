name: PR metadata

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

# A text edit must not cancel a full run started by a target-branch change.
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}-${{ github.event.changes.base && 'base' || 'text' }}
  cancel-in-progress: true

jobs:
  base-ci:
    if: ${{ github.event.changes.base }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  policy:
    if: ${{ !github.event.changes.base }}
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # This job never checks out or imports candidate code. The bootstrap
      # variable must name a separately reviewed commit, never a candidate ref.
      - name: Validate optional bootstrap identity
        env:
          BOOTSTRAP_SHA: ${{ vars.CI_POLICY_SHA }}
        run: |
          if [[ -n "$BOOTSTRAP_SHA" && ! "$BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'CI_POLICY_SHA must be a reviewed full commit SHA.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.CI_POLICY_SHA || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require the reviewed contribution validator
        run: |
          test -f scripts/ci/check-pr.mjs || { echo 'Reviewed policy bootstrap is required; see docs/CI.md.'; exit 1; }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/ci/check-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
