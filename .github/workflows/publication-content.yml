name: Publication content

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issues:
    types: [edited, deleted, closed, reopened, transferred]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Publication]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Each run reconciles all open PRs and current queue heads. Coalescing pending
# events therefore cannot omit a different PR affected by a linked issue edit.
concurrency:
  group: publication-content-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Install trusted pinned dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recheck current public content using default-branch code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publication/recheck.mjs
