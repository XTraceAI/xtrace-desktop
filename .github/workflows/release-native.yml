name: Release native validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the merged release candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-native-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Require an explicit candidate and the default-branch workflow
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and macOS 14 arm64
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-14-arm64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/xtrace-ci-tools
          key: supply-tools-macos-14-arm64-syft-1.51.1-about-0.9.2
      - name: Check out the pinned capture producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: XTraceAI/agent-plugins
          ref: 2538729a39c4903672c83e3f9f2a655ec6ac9a87 # must equal .plugin-pin commit
          path: artifacts/private/plugin-conformance
          persist-credentials: false
      - name: Validate the native release candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AGENT_PLUGINS_DIR: ${{ github.workspace }}/artifacts/private/plugin-conformance/plugins/memhub
        run: |
          REVIEWED_BASE_SHA="$(git rev-parse "$CANDIDATE_SHA^1")"
          pnpm check:native --base "$REVIEWED_BASE_SHA" --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.candidate_sha }}
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Signing runs only after the credential-free validation above passes, in the
  # protected macos-signing environment. Only the step that signs sees Apple values.
  package:
    needs: native
    runs-on: macos-14
    timeout-minutes: 150
    environment: macos-signing
    steps:
      - name: Require an explicit candidate and the default-branch workflow
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and macOS 14 arm64
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 14.* ]]
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-14-arm64
      - name: Build the release app without signing values
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm tauri build --no-bundle
      - name: Sign and notarize the app and the disk image, then check them
        env:
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: XTrace Inc. (3C8BCX5J3H)'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/ci/release-dmg.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg-${{ inputs.candidate_sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
