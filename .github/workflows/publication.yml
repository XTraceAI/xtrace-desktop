name: Publication

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: publication-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  publication-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Exercise publication failure cases
        run: node --test scripts/publication/*.test.mjs scripts/security/*.test.mjs

  publication-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check source history and public content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publication/check.mjs

  publication-checks:
    name: publication-checks
    if: ${{ always() }}
    needs: [publication-tests, publication-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every publication gate to pass
        env:
          TEST_RESULT: ${{ needs.publication-tests.result }}
          SCAN_RESULT: ${{ needs.publication-scan.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$SCAN_RESULT" = success
