[package]
name = "xtrace-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "xtrace_desktop"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
fixtures = ["dep:xt-fixtures"]

[dependencies]
serde.workspace = true
ts-rs = "=12.0.1"
xt-store = { path = "../../../crates/xt-store" }
xt-ingest = { path = "../../../crates/xt-ingest" }
xt-fixtures = { path = "../../../crates/xt-fixtures", optional = true }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "=2.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow"] }

[dev-dependencies]
serde_json = "=1.0.151"

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"
