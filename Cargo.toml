[workspace]
members = [
    "crates/xt-server",
    "crates/xt-store",
    "crates/xt-ingest",
    "crates/xt-metrics",
    "crates/xt-probes",
    "crates/xt-judge",
    "crates/xt-fixtures",
    "crates/xt-rulebook",
    "xtask",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
authors = ["XTrace Inc."]

# The local app is installed from a debug build. Most Dashboard read time is
# spent inside the bundled SQLite, which debug builds compile unoptimized.
# Optimize only that package (its C library and Rust bindings); every other
# package keeps the normal debug settings.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
